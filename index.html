<!DOCTYPE html>
<html>
  <head>
    <title>Multi Step Form</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Multi Step Form">
    <meta name="keywords" content="HTML, CSS, JavaScript, Multi Step Form, Form">
    <meta name="author" content="Omar">
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="dist/style.min.css">
  </head>
  <body>
    <div class="container">
      <ul class="sidebar" id="sidebar">
        <li class="active" id="step-1" data-step="1">
          <p>Step 1</p>
          <div>Your Info</div>
        </li>
        <li id="step-2" data-step="2">
          <p>Step 2</p>
          <div>Select Plan</div>
        </li>
        <li id="step-3" data-step="3">
          <p>Step 3</p>
          <div>Add-ons</div>
        </li>
        <li id="step-4" data-step="4">
          <p>Step 4</p>
          <div>Summary</div>
        </li>
      </ul>
      <form class="step-1" id="form"></form>
    </div>
    <script src="dist/main.js" defer></script>
  </body>
</html>
